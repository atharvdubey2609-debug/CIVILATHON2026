<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default('Civilathon') }} | CIVILATHON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='images/lnct-logo.png') }}" alt="LNCT"><span>×</span><img src="{{ url_for('static', filename='images/cic-logo.png') }}" alt="Civil Impact Club"></a>
    <nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('about') }}">About</a><a href="{{ url_for('domains') }}">Domains</a><a href="{{ url_for('rules') }}">Rules</a><a href="{{ url_for('guidelines') }}">Guidelines</a><a href="{{ url_for('submission') }}">PPT</a><a class="nav-cta" href="{{ url_for('register') }}">Register</a></nav>
  </div>
</header>
<main class="page-main">
  {% if content %}<section class="content-page"><span class="eyebrow">CIVILATHON</span><h1>{{ title }}</h1><div class="page-content">{{ content|safe }}</div></section>{% else %}{% block content %}{% endblock %}{% endif %}
</main>
<footer class="site-footer"><div><strong>CIVILATHON</strong><span>Identify • Innovate • Impact</span></div><p>Presented by Civil Engineering Department, LNCT Bhopal × Civil Impact Club</p></footer>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
